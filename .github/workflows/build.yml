name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          name: gd-ai-mod

      - name: Upload combined build
        uses: actions/upload-artifact@v4
        with:
          name: gd-ai-mod.geode
          path: ${{ steps.combine.outputs.build-output }}
